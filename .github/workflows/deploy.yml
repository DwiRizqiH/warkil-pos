name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reset data penjualan, lalu isi ulang dengan demo atau biarkan kosong'
        type: choice
        options: [demo, reset]
        required: true
      confirm:
        description: "Isi 'wipe' kalau memilih demo atau reset — pesanan di server akan dihapus"
        type: string
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warkil
          POSTGRES_PASSWORD: warkil
          POSTGRES_DB: warkil_kasir_test
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Semua action di-pin ke commit SHA, bukan tag — tag bisa digeser dan
      # action pihak ketiga punya akses ke secrets (SSH_PASSWORD).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://warkil:warkil@localhost:5434/warkil_kasir_test
        run: |
          npm ci
          npx prisma generate
          npm test

      - name: Periksa mode dan konfirmasi
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ github.event_name == 'push' && 'production' || inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy hanya dari main, bukan $GITHUB_REF."
            exit 1
          fi
          case "$MODE" in
            production)
              echo "::notice::Mode production: menu, kasir, dan pengaturan di-upsert, data penjualan tidak dihapus."
              ;;
            demo | reset)
              if [ "$CONFIRM" != wipe ]; then
                echo "::error::Mode $MODE menghapus semua pesanan, pembayaran, dan shift di server. Isi input confirm dengan 'wipe' kalau memang itu yang diinginkan."
                exit 1
              fi
              echo "::warning::Mode $MODE: semua pesanan, pembayaran, dan shift di server DIHAPUS dan tidak bisa dikembalikan. Jangan pilih mode ini di server yang sudah dipakai jualan sungguhan."
              ;;
          esac

      - name: Upload source + build ke server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || '155.94.164.159' }}
          username: ${{ secrets.SSH_USER || 'dwi' }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'frontend/dist,backend,deploy'
          target: /home/dwi/warkil-kasir
          overwrite: true

      - name: Install backend deps, migrate, restart PM2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          MODE: ${{ github.event_name == 'push' && 'production' || inputs.mode }}
          WIPE_CONFIRMED: ${{ (inputs.mode == 'demo' || inputs.mode == 'reset') && 'wipe' || '' }}
        with:
          host: ${{ secrets.SSH_HOST || '155.94.164.159' }}
          username: ${{ secrets.SSH_USER || 'dwi' }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: MODE,WIPE_CONFIRMED
          script: bash /home/dwi/warkil-kasir/deploy/deploy.sh
