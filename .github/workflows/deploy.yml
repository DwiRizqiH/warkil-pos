name: Deploy ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload source + build ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || '155.94.164.159' }}
          username: ${{ secrets.SSH_USER || 'dwi' }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'frontend/dist,backend,deploy'
          target: /home/dwi/warkil-kasir
          overwrite: true

      - name: Install backend deps & reload PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || '155.94.164.159' }}
          username: ${{ secrets.SSH_USER || 'dwi' }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: bash /home/dwi/warkil-kasir/deploy/deploy.sh
